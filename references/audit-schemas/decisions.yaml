# decisions.yaml — the negative-memory ledger
#
# Every REJECTED candidate produces a decision here. This is the highest-
# value memory in the whole system: it prevents the next slice (or the
# next engagement) from re-discovering the same false positive.
#
# CONFIRMED candidates also produce a decision so the reasoning stays
# with the finding — but the finding itself lives in
# .t3mp3st/<target>/findings/F-*.md (via report.sh import-evidence).

schema_version: 1

